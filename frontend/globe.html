<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>Global Risk Terminal | Analyso</title>
  <meta name="description" content="Institutional Indian market news sentiment terminal.">
  <meta name="robots" content="index, nofollow">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Globe.gl via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.2/dist/globe.gl.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/globe.css?v=7">
</head>

<body>

<!-- ═══════════ COMMAND / TOP BAR ═══════════ -->
<header class="command-bar terminal-panel">
    <div style="display:flex; align-items:center; gap:20px;">
        <span class="sys-title">ANALYSO // GLOBAL RISK TIE // MACRO-EQUITY</span>
        <a href="index.html" class="cmd-btn">[ESC] BACK TO SCANNER</a>
    </div>
    
    <div style="display:flex; align-items:center; gap:16px;">
        <div class="status-indicator">
            <span class="status-dot"></span>
            SYS: ONLINE
        </div>
        <button class="cmd-btn" onclick="fetchSentimentData()">[F5] FORCE REFRESH</button>
    </div>
</header>

<!-- ═══════════ TOP INDICES BAR ═══════════ -->
<div class="top-indices-bar" id="topIndicesBar">
    <!-- JS pops in indices cards here -->
</div>

<!-- ═══════════ MAIN LAYOUT GRID ═══════════ -->
<div class="main-layout">
    <!-- ═══════════ 3D GLOBE TIE ═══════════ -->
    <div id="globeViz" aria-label="3D Sentiment Globe Terminal"></div>

    <!-- ═══════════ LEFT COLUMN (REGIONAL / SECTOR RISK) ═══════════ -->
    <div class="left-column">
        <div class="sector-panel terminal-panel">
            <div class="panel-header">SECTOR RISK MATRIX &lt;IND&gt;</div>
            <div class="risk-table" id="sectorList">
                <!-- JS pops in rows here -->
            </div>
        </div>
    </div>

    <!-- ═══════════ RIGHT: LIVE INTELLIGENCE ═══════════ -->
    <div class="feed-panel terminal-panel">
        <div class="panel-header">LIVE INTELLIGENCE FEED &lt;RSS&gt;</div>
        <div class="feed-filters">
            <button class="filter-btn active" data-filter="all" onclick="filterNews('all', this)">[ALL SCANS]</button>
            <button class="filter-btn text-bearish" data-filter="bearish" onclick="filterNews('bearish', this)">[HIGH RISK]</button>
            <button class="filter-btn text-bullish" data-filter="bullish" onclick="filterNews('bullish', this)">[BULLISH]</button>
        </div>
        <div class="ticker-container" id="newsFeedList">
            <!-- JS pops in ticker items here -->
        </div>
    </div>
</div>

<!-- ═══════════ BOTTOM: STATUS BAR ═══════════ -->
<footer class="sys-footer">
    <span id="statTime">TIME: --:--:--</span>
    <span>|</span>
    <span class="text-accent">VOL: <span id="statTotal">--</span> MSGS</span>
    <span>|</span>
    <span class="text-bullish">BLL: <span id="statBullish">--</span></span>
    <span>|</span>
    <span class="text-bearish">BRH: <span id="statBearish">--</span></span>
    <span>|</span>
    <span class="text-neutral">NTR: <span id="statNeutral">--</span></span>
</footer>

<!-- ═══════════ TERMINAL LOADER ═══════════ -->
<div id="globeLoading" class="terminal-loader">
    INITIATING TERMINAL PROTOCOL...<br>
    ESTABLISHING RSS FEED LINK...<span class="loader-cursor"></span>
</div>

<!-- ═══════════ SCRIPTS ═══════════ -->
<script src="js/config.js?v=6"></script>
<script src="js/globe.js?v=8"></script>

</body>
</html>
