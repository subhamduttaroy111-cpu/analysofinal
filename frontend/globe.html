<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <title>3D News Sentiment Globe | Analyso – Indian Stock Market</title>
  <meta name="description" content="Real-time 3D visualization of Indian financial news sentiment. See live market mood across Mumbai, Delhi, Bengaluru and more financial hubs powered by AI.">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://www.analyso.online/globe.html">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://www.analyso.online/logo.png">
  <link rel="apple-touch-icon" href="https://www.analyso.online/logo.png">
  <meta name="theme-color" content="#020617">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="3D News Sentiment Globe | Analyso">
  <meta property="og:description" content="Real-time 3D globe showing Indian stock market news sentiment across major financial hubs.">
  <meta property="og:site_name" content="Analyso">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Globe.gl via CDN (jsdelivr — reliable) -->
  <script src="https://cdn.jsdelivr.net/npm/globe.gl@2.27.2/dist/globe.gl.min.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="css/globe.css">
</head>

<body>

<!-- ═══════════ LOADING SCREEN ═══════════ -->
<div id="globeLoading" class="globe-loading">
    <div class="globe-loading-spinner"></div>
    <p class="globe-loading-text">Scanning global news sentiment...</p>
</div>

<!-- ═══════════ HEADER ═══════════ -->
<header class="globe-header">
    <div class="globe-header-left">
        <a href="index.html" class="back-btn">← Back to Scanner</a>
        <div>
            <div class="globe-title">🌍 News Sentiment Globe</div>
            <div class="globe-subtitle">Real-Time Indian Market Mood</div>
        </div>
    </div>
    <div class="header-right">
        <div class="live-badge">
            <span class="live-dot"></span>
            LIVE
        </div>
        <button class="refresh-btn" onclick="fetchSentimentData()">🔄 Refresh</button>
    </div>
</header>

<!-- ═══════════ SENTIMENT OVERVIEW BAR (centered below header) ═══════════ -->
<div class="sentiment-bar">
    <div class="sentiment-bar-item bullish">
        <span class="sentiment-bar-dot bullish"></span>
        <span>Bullish</span>
        <strong id="barBullish">—</strong>
    </div>
    <div class="sentiment-bar-divider"></div>
    <div class="sentiment-bar-item bearish">
        <span class="sentiment-bar-dot bearish"></span>
        <span>Bearish</span>
        <strong id="barBearish">—</strong>
    </div>
    <div class="sentiment-bar-divider"></div>
    <div class="sentiment-bar-item neutral">
        <span class="sentiment-bar-dot neutral"></span>
        <span>Neutral</span>
        <strong id="barNeutral">—</strong>
    </div>
    <div class="sentiment-bar-divider"></div>
    <div class="sentiment-bar-total">
        <span id="barTotal">—</span> headlines scanned
    </div>
</div>

<!-- ═══════════ 3D GLOBE ═══════════ -->
<div id="globeViz" aria-label="3D interactive globe showing Indian financial news sentiment"></div>

<!-- ═══════════ CITY BREAKDOWN (Left Panel) ═══════════ -->
<div class="city-panel">
    <div class="panel-title"><span class="panel-title-icon">📍</span> City Sentiment</div>
    <div id="cityList">
        <!-- Populated by globe.js -->
    </div>
</div>

<!-- ═══════════ NEWS FEED (Right Panel) ═══════════ -->
<div class="news-feed-panel">
    <div class="panel-title"><span class="panel-title-icon">📰</span> Live Headlines</div>
    
    <!-- Tab Filters -->
    <div class="feed-tabs">
        <button class="feed-tab active" data-filter="all" onclick="filterNews('all', this)">All</button>
        <button class="feed-tab tab-bearish" data-filter="bearish" onclick="filterNews('bearish', this)">🔴 Bad</button>
        <button class="feed-tab tab-bullish" data-filter="bullish" onclick="filterNews('bullish', this)">🟢 Good</button>
    </div>

    <div id="newsFeedList">
        <!-- Populated by globe.js -->
    </div>
</div>

<!-- ═══════════ SCRIPTS ═══════════ -->
<script src="js/config.js"></script>
<script src="js/globe.js"></script>

</body>
</html>
